<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hacked by Roman NP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    /* ===== RESET ===== */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Courier New", monospace;
    }

    body {
        background: black;
        color: #00ff00;
        height: 100vh;
        overflow: hidden;
    }

    /* ===== MATRIX BACKGROUND ===== */
    canvas {
        position: fixed;
        top: 0;
        left: 0;
        z-index: -1;
    }

    /* ===== CENTER CONTENT ===== */
    .container {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    h1 {
        font-size: 3rem;
        text-shadow: 0 0 10px #00ff00;
        animation: flicker 2s infinite;
    }

    h2 {
        margin-top: 15px;
        font-size: 1.5rem;
        opacity: 0.9;
    }

    p {
        margin-top: 25px;
        max-width: 600px;
        line-height: 1.6;
        opacity: 0.8;
    }

    .line {
        margin-top: 30px;
        width: 80%;
        height: 2px;
        background: #00ff00;
        box-shadow: 0 0 10px #00ff00;
    }

    footer {
        position: absolute;
        bottom: 20px;
        font-size: 0.9rem;
        opacity: 0.6;
    }

    @keyframes flicker {
        0% { opacity: 1; }
        50% { opacity: 0.6; }
        100% { opacity: 1; }
    }
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="container">
    <h1>HACKED BY ROMAN NP</h1>
    <h2>Ethical Hacking • Cyber Security • Learning Mode</h2>

    <div class="line"></div>

    <p>
        This page is a <b>visual hacking theme</b> created for educational,
        portfolio, and design practice purposes only.<br>
        <br>
        Knowledge is power. Use it ethically.
    </p>

    <footer>
        © Roman NP | Cyber Security Learner
    </footer>
</div>

<script>
    /* ===== MATRIX EFFECT ===== */
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%^&*";
    const fontSize = 14;
    const columns = canvas.width / fontSize;

    const drops = [];
    for (let i = 0; i < columns; i++) {
        drops[i] = 1;
    }

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#00ff00";
        ctx.font = fontSize + "px monospace";

        for (let i = 0; i < drops.length; i++) {
            const text = letters.charAt(Math.floor(Math.random() * letters.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }

    setInterval(drawMatrix, 33);

    window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
</script>

</body>
</html>
